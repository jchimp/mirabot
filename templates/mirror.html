<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ assistant_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mirror.css') }}">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('mirror-theme');
            const fallbackTheme = '{{ default_theme }}';
            document.documentElement.setAttribute('data-theme', savedTheme || fallbackTheme);
            const savedFace = localStorage.getItem('mirror-face');
            const fallbackFace = '{{ default_face }}';
            document.documentElement.setAttribute('data-face', savedFace || fallbackFace);
        })();
    </script>
</head>
<body>
    <!-- ── History Sidebar ───────────────────────── -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>conversations</h2>
            <div class="sidebar-actions">
                <button id="import-session-btn" class="sidebar-btn" title="Import conversation">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </button>
                <button id="new-session-btn" class="sidebar-btn" title="New conversation">+</button>
            </div>
            <input type="file" id="import-file-input" accept=".json" hidden>
        </div>
        <ul id="session-list" class="session-list"></ul>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div id="mirror">
        <!-- ── Top bar ───────────────────────────── -->
        <div class="top-bar">
            <button id="history-btn" class="icon-btn" aria-label="Conversation history" title="History">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <span id="session-title" class="session-title"></span>

            <!-- ── Face Toggle ───────────────────── -->
            <button id="face-toggle" class="theme-toggle" aria-label="Toggle face mode" title="Switch face">
                <svg class="face-icon face-icon-face" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="9" cy="10" r="1.2" fill="currentColor"/>
                    <circle cx="15" cy="10" r="1.2" fill="currentColor"/>
                    <path d="M8 15c1.5 2 6.5 2 8 0"/>
                </svg>
                <svg class="face-icon face-icon-hal" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="5" fill="currentColor" opacity="0.3"/>
                    <circle cx="12" cy="12" r="2" fill="currentColor"/>
                </svg>
            </button>

            <!-- ── Theme Toggle ──────────────────── -->
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Switch theme">
                <svg class="theme-icon theme-icon-mirror" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="theme-icon theme-icon-slate" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>

        <!-- ── Face: Eyes + Mouth ────────────────── -->
        <svg id="face" class="face-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="4" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            <ellipse id="left-eye" cx="155" cy="175" rx="18" ry="22"
                     class="eye face-element" filter="url(#glow)"/>
            <ellipse id="right-eye" cx="245" cy="175" rx="18" ry="22"
                     class="eye face-element" filter="url(#glow)"/>
            <circle id="left-pupil" cx="155" cy="178" r="7" class="pupil"/>
            <circle id="right-pupil" cx="245" cy="178" r="7" class="pupil"/>
            <path id="mouth" d="M 165 270 Q 200 285 235 270"
                  stroke-width="3" fill="none"
                  stroke-linecap="round" filter="url(#glow)" class="mouth-element"/>
            <g id="thinking-dots" class="thinking-dots">
                <circle cx="185" cy="310" r="4" class="dot dot-1 face-element"/>
                <circle cx="200" cy="310" r="4" class="dot dot-2 face-element"/>
                <circle cx="215" cy="310" r="4" class="dot dot-3 face-element"/>
            </g>
            <circle id="listen-ring" cx="200" cy="270" r="40"
                    stroke-width="1.5" fill="none" class="listen-ring"/>
        </svg>

        <!-- ── Face: HAL 9000 Eye ────────────────── -->
        <svg id="hal" class="hal-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="hal-lens-gradient" cx="50%" cy="45%" r="50%">
                    <stop offset="0%"  stop-color="#ffaa00" stop-opacity="0.9"/>
                    <stop offset="30%" stop-color="#ff2200" stop-opacity="0.85"/>
                    <stop offset="70%" stop-color="#cc0000" stop-opacity="0.7"/>
                    <stop offset="100%" stop-color="#440000" stop-opacity="0.5"/>
                </radialGradient>
                <radialGradient id="hal-housing-gradient" cx="50%" cy="50%" r="50%">
                    <stop offset="60%" stop-color="#1a1a1a"/>
                    <stop offset="100%" stop-color="#0a0a0a"/>
                </radialGradient>
                <filter id="hal-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="12" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="hal-outer-glow" x="-100%" y="-100%" width="300%" height="300%">
                    <feGaussianBlur stdDeviation="25" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- Ambient red glow (outermost, very soft) -->
            <circle id="hal-ambient" cx="200" cy="200" r="80"
                    fill="rgba(200, 0, 0, 0.06)" filter="url(#hal-outer-glow)"/>

            <!-- Outer housing ring (dark metallic) -->
            <circle cx="200" cy="200" r="72"
                    fill="url(#hal-housing-gradient)"
                    stroke="#2a2a2a" stroke-width="2"/>

            <!-- Outer lens ring -->
            <circle cx="200" cy="200" r="56"
                    fill="none" stroke="#333" stroke-width="1.5"/>

            <!-- Main red lens -->
            <circle id="hal-lens" cx="200" cy="200" r="52"
                    fill="url(#hal-lens-gradient)"
                    filter="url(#hal-glow)"/>

            <!-- Inner ring detail -->
            <circle cx="200" cy="200" r="34"
                    fill="none" stroke="rgba(255, 100, 0, 0.15)" stroke-width="0.8"/>

            <!-- Bright center point -->
            <circle id="hal-center" cx="200" cy="198" r="12"
                    fill="rgba(255, 200, 100, 0.7)"/>

            <!-- Hot center dot -->
            <circle id="hal-hotspot" cx="200" cy="196" r="5"
                    fill="rgba(255, 240, 200, 0.9)"/>

            <!-- Specular highlight (top-left reflection) -->
            <ellipse cx="182" cy="182" rx="8" ry="5"
                     fill="rgba(255, 255, 255, 0.08)"
                     transform="rotate(-30, 182, 182)"/>

            <!-- HAL thinking dots -->
            <g id="hal-thinking-dots" class="thinking-dots">
                <circle cx="185" cy="310" r="4" fill="#cc0000" class="dot dot-1"/>
                <circle cx="200" cy="310" r="4" fill="#cc0000" class="dot dot-2"/>
                <circle cx="215" cy="310" r="4" fill="#cc0000" class="dot dot-3"/>
            </g>

            <!-- HAL listening ring -->
            <circle id="hal-listen-ring" cx="200" cy="200" r="85"
                    stroke="rgba(200, 0, 0, 0.1)" stroke-width="1.5"
                    fill="none" class="hal-listen-ring"/>
        </svg>

        <!-- ── Transcript ────────────────────────── -->
        <div id="transcript" class="transcript">
            <div id="conversation-log" class="conversation-log"></div>
            <div id="user-text" class="user-text"></div>
            <div id="mirror-text" class="mirror-text"></div>
        </div>

        <!-- ── Controls ──────────────────────────── -->
        <div class="controls">
            <div id="status" class="status-text">tap mic or press space</div>
            <button id="mic-btn" class="mic-btn" aria-label="Push to talk">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="1" width="6" height="13" rx="3"/>
                    <path d="M5 10a7 7 0 0 0 14 0"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                </svg>
            </button>
            <div class="control-row">
                <button id="clear-btn" class="clear-btn" aria-label="Clear conversation">clear</button>
                <span class="control-dot">·</span>
                <button id="export-btn" class="clear-btn" aria-label="Export conversation">export</button>
            </div>
        </div>
    </div>

    <input type="hidden" id="default-theme" value="{{ default_theme }}">
    <input type="hidden" id="default-face" value="{{ default_face }}">
    <input type="hidden" id="transform-volume" value="{{ transform_volume }}">

    <script src="{{ url_for('static', filename='js/audio.js') }}"></script>
    <script src="{{ url_for('static', filename='js/face.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
