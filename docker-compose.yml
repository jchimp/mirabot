services:
  # ── Flask App ──────────────────────────────────────────
  mirabot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mirabot
    ports:
      - "5000:5000"
     #- "8090:8090"           # auth callback (only needed during setup)
    extra_hosts:
          - "host.docker.internal:host-gateway"   # access to local host
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - mirabot_data:/data                         # persistent DB storage
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-me-in-production}
    depends_on:
      - whisper-server
      - piper-server
    restart: unless-stopped

  # ── faster-whisper (STT) ───────────────────────────────
  # Uses onerahmet/openai-whisper-asr-webservice with faster-whisper backend.
  # Exposes /asr endpoint on port 9000.
  whisper-server:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: mirabot-whisper
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=base            # Options: tiny, base, small, medium, large-v3
      - ASR_ENGINE=faster_whisper
    restart: unless-stopped

  # ── Piper (TTS) ───────────────────────────────────────
  # Custom thin HTTP wrapper around piper-tts.
  # Voice models must be downloaded to ./piper-models/ (see README).
  piper-server:
    build:
      context: ./piper-server
      dockerfile: Dockerfile
    container_name: mirabot-piper
    ports:
      - "5001:5000"
    volumes:
      - ./piper-models:/models:ro
    environment:
      - PIPER_DEFAULT_VOICE=en_US-lessac-medium
    restart: unless-stopped

volumes:
  mirabot_data:
